name: Deploy Hakyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force clean rebuild (ignore cache)'
        type: boolean
        default: false
      run_cabal_update:
        description: 'Run cabal update before building'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  hlint:
    name: HLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/hlint-setup@v2
        with:
          version: '3.8'
      - run: hlint src/

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haskell
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'
          cabal-update: false

      # Must run before the index cache step, which uses it in its key.
      - name: Get week number (for index cache key)
        id: date
        run: echo "week=$(date +%Y-%U)" >> $GITHUB_OUTPUT

      - name: Cache Cabal package index
        uses: actions/cache@v4
        with:
          path: ~/.cabal/packages
          key: ${{ runner.os }}-cabal-index-${{ steps.date.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-cabal-index-
        id: cache-index

      - name: Update Cabal index if needed
        if: steps.cache-index.outputs.cache-hit != 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_cabal_update)
        run: cabal update

      - name: Cache dist-newstyle
        uses: actions/cache@v4
        with:
          path: dist-newstyle
          key: ${{ runner.os }}-ghc-9.6.7-dist-${{ hashFiles('hakyll-blog.cabal') }}-${{ hashFiles('src/**/*.hs') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.6.7-dist-${{ hashFiles('hakyll-blog.cabal') }}-
            ${{ runner.os }}-ghc-9.6.7-dist-

      # Key the store on the resolved build plan, not the .cabal file: the plan
      # changes whenever the index brings new dependency versions, and an
      # unchanged key would never re-save the store, rebuilding pandoc & co.
      # from scratch on every run.
      - name: Resolve build plan
        run: cabal build site --dry-run

      - name: Restore Cabal store
        id: cache-store
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-9.6.7-store-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.6.7-store-

      - name: Build dependencies
        run: cabal build site --only-dependencies

      - name: Save Cabal store
        if: steps.cache-store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

      - name: Cache Hakyll incremental data
        uses: actions/cache@v4
        with:
          path: _cache
          key: ${{ runner.os }}-hakyll-${{ hashFiles('src/**/*.hs', 'templates/**') }}
          restore-keys: |
            ${{ runner.os }}-hakyll-

      - name: Build site
        run: |
          ${{ github.event.inputs.force_rebuild == 'true' && 'cabal run site clean &&' || '' }} cabal run site build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [hlint, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
